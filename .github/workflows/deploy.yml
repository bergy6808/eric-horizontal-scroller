on:
  push:
    tags:
    - "v[0-9]+.[0-9]+.[0-9]+"
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write  # enable GitHub OIDC token issuance for this job
    steps:
    - name: Checkout
      uses: actions/checkout@v3
    - name: Verify commit exists in origin/main
      run: |
        git fetch --no-tags --prune --depth=1 origin +refs/heads/*:refs/remotes/origin/*
        git branch --remote --contains | grep origin/main
    - name: Set VERSION variable from tag
      run: echo "VERSION=${GITHUB_REF/refs\/tags\/v/}" >> $GITHUB_ENV

    # Get a short-lived NuGet API key
    - name: NuGet login (OIDC → temp API key)
      uses: NuGet/login@v1
      id: login
      with:
        user: bergy6808
      
    - name: auto minify files
      uses: nizarmah/auto-minify@v3
      with:
        directory: 'HorizontalScroller/wwwroot'
        js_engine: 'uglify-js'

    - name: Build
      run: dotnet build HorizontalScroller --configuration Release /p:Version=${VERSION}
    # - name: Test
    #   run: dotnet test --configuration Release /p:Version=${VERSION} --no-build
    - name: Pack
      run: dotnet pack HorizontalScroller --configuration Release /p:Version=${VERSION} --no-build --output .
    - name: Push
      run: dotnet nuget push BlazorHorizontalScroller.${VERSION}.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{steps.login.outputs.NUGET_API_KEY}}
      